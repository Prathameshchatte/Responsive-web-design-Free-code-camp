<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1 id="title">Survey Form</h1>
        <p id="description">We would love to hear your feedback!</p>

        <form id="survey-form">
            <div class="form-group">
                <label id="name-label" for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label id="email-label" for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label id="number-label" for="number">Age:</label>
                <input type="number" id="number" name="age" min="10" max="100" placeholder="Enter your age" required>
            </div>

            <div class="form-group">
                <label for="dropdown">How did you hear about us?</label>
                <select id="dropdown" name="source" required>
                    <option value="">Select an option</option>
                    <option value="friends">Friends</option>
                    <option value="internet">Internet</option>
                    <option value="advertisement">Advertisement</option>
                </select>
            </div>

            <div class="form-group">
                <p>Would you recommend us to a friend?</p>
                <label><input type="radio" name="recommend" value="yes" required> Yes</label>
                <label><input type="radio" name="recommend" value="no" required> No</label>
            </div>

            <div class="form-group">
                <p>Select your favorite features:</p>
                <label><input type="checkbox" name="features" value="design"> Design</label>
                <label><input type="checkbox" name="features" value="performance"> Performance</label>
                <label><input type="checkbox" name="features" value="usability"> Usability</label>
            </div>

            <div class="form-group">
                <label for="comments">Additional comments:</label>
                <textarea id="comments" name="comments" rows="4" placeholder="Enter your comments here"></textarea>
            </div>

            <div class="form-group">
                <button type="submit" id="submit">Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
